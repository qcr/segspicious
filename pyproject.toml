[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segspicious"
version = "0.1.0"
description = "Protocols, modifiers, and metrics for segmentation UQ benchmarking."
requires-python = ">= 3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["segspicious", "experiments"]

[tool.pytest.ini_options]
testpaths = ["segspicious/tests"]
